<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reunião • SPEED VOICE</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:#f5f6f8;background:#090b0e}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{padding:25px clamp(20px,5vw,65px);background:#101318;border-bottom:1px solid #2b3038}header h2{font-size:20px;letter-spacing:2px;margin:0 0 6px}small{color:#9ba4b1}main{max-width:560px;margin:clamp(45px,8vh,110px) auto;padding:clamp(24px,5vw,43px);background:#14181e;border:1px solid #2a3038;border-radius:22px;box-shadow:0 20px 60px #0003}main h2{font-size:29px;letter-spacing:-.6px}main p{color:#aab2bd;line-height:1.5}input{width:100%;padding:16px;background:#0e1218;color:white;border:1px solid #363d47;border-radius:11px;margin:10px 0 16px;font:inherit;outline:none}input:focus{border-color:#cf4055}button{padding:14px 19px;background:#bc3044;color:white;border:1px solid transparent;border-radius:11px;cursor:pointer;font:inherit;font-weight:650;margin:4px 7px 4px 0}button:hover{filter:brightness(1.12)}#mute{background:#1e3730;color:#d5f7e9;border-color:#3e675a}#mute.muted{background:#44252d;color:#ffe1e5;border-color:#8c4151}#leave{background:#242a32;border-color:#363e49}#people{padding:20px 0;color:#d6dce4;line-height:2}#status{font-size:14px}#call{border-top:1px solid #303640;padding-top:20px;margin-top:20px}@media(max-width:650px){main{margin:30px 15px}button{width:100%;margin:5px 0}}</style><header><h2>⚡ SPEED VOICE</h2><small>Reunião privada</small></header><main><h2>Entrar na reunião</h2><p>Informe seu nome para participar.</p><div id="start"><input id="name" placeholder="Seu nome completo"><button id="join">Entrar na reunião</button></div><p id="status"></p><div id="call" hidden><button id="mute">Silenciar microfone</button><button id="leave">Sair</button><div id="people"></div></div></main><script type="module">
import {Room,RoomEvent} from 'https://esm.sh/livekit-client@2.15.7';
const $=id=>document.getElementById(id);const key=new URLSearchParams(location.search).get('key');let room=null;
async function api(body){const r=await fetch('/api/meeting/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha ao entrar');return j}
function micUI(){if(!room)return;const on=room.localParticipant.isMicrophoneEnabled;$('mute').textContent=on?'🎙 Microfone ligado · Silenciar':'🔇 Microfone desligado · Ativar';$('mute').classList.toggle('muted',!on)}
function people(){if(!room)return;$('people').textContent=[room.localParticipant,...room.remoteParticipants.values()].map(p=>p.name||'Participante').join(' • ')}
$('join').onclick=async()=>{try{if(!key)throw Error('Link inválido');$('status').textContent='Conectando...';const j=await api({key,name:$('name').value});room=new Room();room.on(RoomEvent.ParticipantConnected,people);room.on(RoomEvent.ParticipantDisconnected,people);room.on(RoomEvent.Disconnected,()=>{$('status').textContent='Reunião encerrada ou conexão interrompida';$('call').hidden=true;$('start').hidden=false});room.on(RoomEvent.TrackSubscribed,t=>{if(t.kind==='audio')document.body.append(t.attach())});room.on(RoomEvent.TrackUnsubscribed,t=>t.detach().forEach(e=>e.remove()));await room.connect(j.url,j.token);await room.localParticipant.setMicrophoneEnabled(false);micUI();$('start').hidden=true;$('call').hidden=false;$('status').textContent='Você está na reunião';people()}catch(e){$('status').textContent=e.message}};
$('mute').onclick=async()=>{if(!room)return;const on=room.localParticipant.isMicrophoneEnabled;await room.localParticipant.setMicrophoneEnabled(!on);micUI()};
$('leave').onclick=async()=>{if(room)await room.disconnect();room=null;$('call').hidden=true;$('start').hidden=false;$('status').textContent='Você saiu da reunião'};
</script></html>
