<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reunião • SPEED VOICE</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;color:#f5f6f8;background:#090b0e}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{padding:25px clamp(20px,5vw,65px);background:#101318;border-bottom:1px solid #2b3038}header h2{font-size:20px;letter-spacing:2px;margin:0 0 6px}small{color:#9ba4b1}main{max-width:850px;margin:clamp(45px,8vh,110px) auto;padding:clamp(24px,5vw,43px);background:#14181e;border:1px solid #2a3038;border-radius:22px;box-shadow:0 20px 60px #0003}main h2{font-size:29px;letter-spacing:-.6px}main p{color:#aab2bd;line-height:1.5}input{width:100%;padding:16px;background:#0e1218;color:white;border:1px solid #363d47;border-radius:11px;margin:10px 0 16px;font:inherit;outline:none}input:focus{border-color:#cf4055}label{display:block;color:#aab2bd;font-size:13px;margin-top:10px}select{width:100%;padding:16px;background:#0e1218;color:white;border:1px solid #363d47;border-radius:11px;margin:10px 0 16px;font:inherit;outline:none}button{padding:14px 19px;background:#bc3044;color:white;border:1px solid transparent;border-radius:11px;cursor:pointer;font:inherit;font-weight:650;margin:4px 7px 4px 0}button:hover{filter:brightness(1.12)}#mute{background:#1e3730;color:#d5f7e9;border-color:#3e675a}#mute.muted{background:#44252d;color:#ffe1e5;border-color:#8c4151}#leave{background:#242a32;border-color:#363e49}#people{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:22px 0}.attendee{display:flex;align-items:center;gap:12px;background:#1c222a;border:1px solid #343b45;border-radius:14px;padding:14px;min-width:0}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#52232e;border:1px solid #a43b50;color:#fff;font-weight:750;font-size:17px;flex-shrink:0}.attendee strong{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attendee small{font-size:11px;color:#aeb8c5;display:block;margin-top:4px}.attendee.admin .avatar{background:#873043;border-color:#ed657e}.attendee.speaking{border-color:#4b9b77;box-shadow:0 0 0 1px #4b9b7740}#status{font-size:14px}#call{border-top:1px solid #303640;padding-top:20px;margin-top:20px}@media(max-width:650px){main{margin:30px 15px}button{width:100%;margin:5px 0}}</style><header><h2>⚡ SPEED VOICE</h2><small>Reunião privada</small></header><main><h2>Entrar na reunião</h2><p>Informe seu nome para participar.</p><div id="start"><label for="name">Nome completo</label><input id="name" placeholder="Como você quer ser identificado"><label for="unit">Sua loja / unidade</label><select id="unit" required><option value="">Selecione sua loja</option><option value="colatina">Colatina</option><option value="linhares-shell">Linhares Shell</option><option value="linhares-movelar">Linhares Movelar</option><option value="serra">Serra</option><option value="vitoria">Vitória</option><option value="lindemberg">Lindemberg</option><option value="brisamar">Brisamar</option><option value="coqueiral">Coqueiral</option><option value="moxuara">Moxuara</option><option value="maracana">Maracanã</option><option value="diretoria">Diretoria / Administrativo</option></select><button id="join">Entrar na reunião</button></div><p id="status"></p><div id="call" hidden><button id="mute">Silenciar microfone</button><button id="leave">Sair</button><div id="people"></div><div id="screenArea"></div></div></main><script type="module">
import {Room,RoomEvent} from 'https://esm.sh/livekit-client@2.15.7';
const $=id=>document.getElementById(id);const key=new URLSearchParams(location.search).get('key');let room=null;
async function api(body){const r=await fetch('/api/meeting/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha ao entrar');return j}
function micUI(){if(!room)return;const on=room.localParticipant.isMicrophoneEnabled;$('mute').textContent=on?'🎙 Microfone ligado · Silenciar':'🔇 Microfone desligado · Ativar';$('mute').classList.toggle('muted',!on)}
const units={'colatina':'Colatina','linhares-shell':'Linhares Shell','linhares-movelar':'Linhares Movelar','serra':'Serra','vitoria':'Vitória','lindemberg':'Lindemberg','brisamar':'Brisamar','coqueiral':'Coqueiral','moxuara':'Moxuara','maracana':'Maracanã','diretoria':'Diretoria / Administrativo'};
function people(){if(!room)return;const box=$('people');box.replaceChildren();for(const p of [room.localParticipant,...room.remoteParticipants.values()]){let m={};try{m=JSON.parse(p.metadata||'{}')}catch{}const card=document.createElement('div');card.className='attendee'+(m.role==='admin'?' admin':'')+(p.isSpeaking?' speaking':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=(p.name||'?').trim().charAt(0).toLocaleUpperCase('pt-BR');const info=document.createElement('div');info.style.minWidth='0';const name=document.createElement('strong');name.textContent=(p.name||'Participante')+(m.role==='admin'?' · ADMIN':'');const unit=document.createElement('small');unit.textContent=units[m.unit]||'Unidade não informada';info.append(name,unit);card.append(avatar,info);box.append(card)}}
$('join').onclick=async()=>{try{if(!key)throw Error('Link inválido');$('status').textContent='Conectando...';const j=await api({key,name:$('name').value,unit:$('unit').value});room=new Room();room.on(RoomEvent.ParticipantConnected,people);room.on(RoomEvent.ParticipantDisconnected,people);room.on(RoomEvent.ParticipantMetadataChanged,people);room.on(RoomEvent.ActiveSpeakersChanged,people);room.on(RoomEvent.Disconnected,()=>{$('status').textContent='Reunião encerrada ou conexão interrompida';$('call').hidden=true;$('start').hidden=false});room.on(RoomEvent.TrackSubscribed,t=>{if(t.kind==='audio')document.body.append(t.attach());if(t.kind==='video'){const el=t.attach();el.style.cssText='display:block;width:100%;max-height:520px;object-fit:contain;background:#000;border-radius:12px;margin-top:15px';$('screenArea').append(el)}});room.on(RoomEvent.TrackUnsubscribed,t=>t.detach().forEach(e=>e.remove()));await room.connect(j.url,j.token);await room.localParticipant.setMicrophoneEnabled(false);micUI();$('start').hidden=true;$('call').hidden=false;$('status').textContent='Você está na reunião';people()}catch(e){$('status').textContent=e.message}};
$('mute').onclick=async()=>{if(!room)return;const on=room.localParticipant.isMicrophoneEnabled;await room.localParticipant.setMicrophoneEnabled(!on);micUI()};
$('leave').onclick=async()=>{if(room)await room.disconnect();room=null;$('call').hidden=true;$('start').hidden=false;$('status').textContent='Você saiu da reunião'};
</script></html>
