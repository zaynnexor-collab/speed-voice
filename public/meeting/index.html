<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reunião • SPEED VOICE</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#eaf0f9;font:16px Arial,sans-serif}header{padding:24px;background:#142034;border-bottom:2px solid #c33d53}main{max-width:600px;margin:60px auto;padding:25px;background:#17263b;border-radius:15px}input{width:100%;padding:14px;background:#0d1725;color:white;border:1px solid #3a4c64;border-radius:8px;margin-bottom:14px}button{padding:13px;background:#c33d53;color:white;border:0;border-radius:8px;cursor:pointer;margin:5px}#people{padding:15px}small{color:#9bacc3}</style><header><h2>⚡ SPEED VOICE</h2><small>Reunião privada</small></header><main><h2>Entrar na reunião</h2><p>Informe seu nome para participar.</p><div id="start"><input id="name" placeholder="Seu nome completo"><button id="join">Entrar na reunião</button></div><p id="status"></p><div id="call" hidden><button id="mute">Silenciar microfone</button><button id="leave">Sair</button><div id="people"></div></div></main><script type="module">
import {Room,RoomEvent} from 'https://esm.sh/livekit-client@2.15.7';
const $=id=>document.getElementById(id);const key=new URLSearchParams(location.search).get('key');let room=null;
async function api(body){const r=await fetch('/api/meeting/join',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Falha ao entrar');return j}
function people(){if(!room)return;$('people').textContent=[room.localParticipant,...room.remoteParticipants.values()].map(p=>p.name||'Participante').join(' • ')}
$('join').onclick=async()=>{try{if(!key)throw Error('Link inválido');$('status').textContent='Conectando...';const j=await api({key,name:$('name').value});room=new Room();room.on(RoomEvent.ParticipantConnected,people);room.on(RoomEvent.ParticipantDisconnected,people);room.on(RoomEvent.Disconnected,()=>{$('status').textContent='Reunião encerrada ou conexão interrompida';$('call').hidden=true;$('start').hidden=false});room.on(RoomEvent.TrackSubscribed,t=>{if(t.kind==='audio')document.body.append(t.attach())});room.on(RoomEvent.TrackUnsubscribed,t=>t.detach().forEach(e=>e.remove()));await room.connect(j.url,j.token);await room.localParticipant.setMicrophoneEnabled(true);$('start').hidden=true;$('call').hidden=false;$('status').textContent='Você está na reunião';people()}catch(e){$('status').textContent=e.message}};
$('mute').onclick=async()=>{if(!room)return;const on=room.localParticipant.isMicrophoneEnabled;await room.localParticipant.setMicrophoneEnabled(!on);$('mute').textContent=on?'Ativar microfone':'Silenciar microfone'};
$('leave').onclick=async()=>{if(room)await room.disconnect();room=null;$('call').hidden=true;$('start').hidden=false;$('status').textContent='Você saiu da reunião'};
</script></html>
