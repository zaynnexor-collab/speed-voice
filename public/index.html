<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPEED VOICE</title><style>:root{font-family:Inter,Arial,sans-serif;color:#eaf0f9;background:#0b1019}*{box-sizing:border-box}body{margin:0}header{background:#111b2b;padding:20px 5%;border-bottom:2px solid #bb3546;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:23px;letter-spacing:2px}small{color:#98a9bd}.layout{display:grid;grid-template-columns:270px 1fr;min-height:80vh}aside{background:#101a2a;padding:20px}main{padding:30px;max-width:950px}button,input,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #314158}input,select{background:#101a2a;color:white;width:100%;margin:8px 0}button{background:#c23b4e;color:white;cursor:pointer;border:0}button:hover{filter:brightness(1.13)}button:disabled{opacity:.5;cursor:default}.room{display:block;width:100%;text-align:left;margin:7px 0;background:#1a293d}.room.active{background:#a82d42}.card{background:#152235;border:1px solid #263b53;padding:24px;border-radius:16px;margin:15px 0}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap}#participants{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.person{background:#23374d;padding:14px;border-radius:10px}#status{color:#b6c4d7;margin:12px 0}label{display:block;margin-top:12px}#admin{margin-top:25px}@media(max-width:720px){.layout{grid-template-columns:1fr}aside{padding:12px}main{padding:18px}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:6px}.room{margin:0;font-size:12px;padding:9px}}</style></head><body><header><div><h1>⚡ SPEED <span style="color:#e34c60">VOICE</span></h1><small>Comunicação interna • Carga e Descarga</small></div><button id="logout" class="hidden">Sair</button></header><section id="login" class="card" style="max-width:440px;margin:50px auto"><h2>Ativar acesso</h2><p>Entre com seu nome e o convite enviado pela administração.</p><input id="name" placeholder="Nome completo" autocomplete="name"><input id="code" placeholder="Código de convite"><button id="activate">Entrar</button><p id="loginmsg"></p></section><div id="app" class="layout hidden"><aside><h3>SALAS DE VOZ</h3><div class="rooms" id="rooms"></div></aside><main><small id="who"></small><h2 id="roomtitle">Selecione uma sala</h2><p id="status">Você ainda não entrou em nenhuma sala.</p><div class="actions"><button id="join">Entrar na sala</button><button id="mute" disabled>Silenciar microfone</button><button id="leave" disabled>Sair da sala</button></div><div id="participants"></div><section id="admin" class="card hidden"><h3>Gerar convite</h3><input id="inviteName" placeholder="Nome do funcionário (opcional)"><select id="inviteRole"><option value="funcionario">Funcionário</option><option value="lider">Líder</option><option value="admin">Administrador</option></select><select id="inviteRoom"></select><button id="invite">Gerar convite</button><p id="inviteResult"></p></section></main></div><script type="module">
import {Room,RoomEvent} from 'https://esm.sh/livekit-client@2.15.7';
const names={'diretoria':'Diretoria','lideranca':'Liderança','reuniao-geral':'Reunião Geral','colatina':'Colatina','linhares-shell':'Linhares Shell','linhares-movelar':'Linhares Movelar','serra':'Serra','vitoria':'Vitória','lindemberg':'Lindemberg','brisamar':'Brisamar','coqueiral':'Coqueiral','moxuara':'Moxuara','maracana':'Maracanã'};
const $=id=>document.getElementById(id);let user=JSON.parse(localStorage.getItem('sv-user')||'null'),room=null,selected='reuniao-geral';const api=async(path,body)=>{const r=await fetch('/api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'Erro de conexão');return j};
function status(t){$('status').textContent=t}
function allowed(id){return user.role==='admin'||id==='reuniao-geral'||(id==='lideranca'&&user.role==='lider')||id===user.room}
function draw(){ $('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(!user)return;$('who').textContent=user.name+' • '+user.role;$('admin').classList.toggle('hidden',user.role!=='admin');$('rooms').innerHTML='';$('inviteRoom').innerHTML='';for(const [id,label] of Object.entries(names)){if(allowed(id)){const b=document.createElement('button');b.className='room'+(id===selected?' active':'');b.textContent=(id==='diretoria'||id==='lideranca'?'🔒 ':'🔊 ')+label;b.onclick=()=>{selected=id;$('roomtitle').textContent=label;draw()};$('rooms').append(b)}const o=document.createElement('option');o.value=id;o.textContent=label;$('inviteRoom').append(o)}$('roomtitle').textContent=names[selected]}
$('activate').onclick=async()=>{try{const j=await api('activate',{name:$('name').value,code:$('code').value});user={token:j.token,name:j.name,role:j.role,room:j.room};localStorage.setItem('sv-user',JSON.stringify(user));selected=user.room;draw()}catch(e){$('loginmsg').textContent=e.message}};
$('logout').onclick=async()=>{if(room)await room.disconnect();room=null;user=null;localStorage.removeItem('sv-user');draw()};
function people(){if(!room)return;$('participants').innerHTML='';for(const p of [room.localParticipant,...room.remoteParticipants.values()]){const e=document.createElement('div');e.className='person';e.textContent='🎙 '+(p.name||'Participante');$('participants').append(e)}}
$('join').onclick=async()=>{try{if(room)await room.disconnect();status('Conectando...');const j=await api('token',{session:user.token,room:selected});room=new Room({adaptiveStream:true,dynacast:true});room.on(RoomEvent.ParticipantConnected,people);room.on(RoomEvent.ParticipantDisconnected,people);room.on(RoomEvent.TrackSubscribed,(track)=>{if(track.kind==='audio'){const el=track.attach();document.body.append(el)}});room.on(RoomEvent.TrackUnsubscribed,track=>track.detach().forEach(e=>e.remove()));await room.connect(j.url,j.token);await room.localParticipant.setMicrophoneEnabled(true);$('mute').disabled=false;$('leave').disabled=false;status('Conectado à sala '+names[selected]);people()}catch(e){status('Erro: '+e.message)}};
$('mute').onclick=async()=>{if(!room)return;const active=room.localParticipant.isMicrophoneEnabled;await room.localParticipant.setMicrophoneEnabled(!active);$('mute').textContent=active?'Ativar microfone':'Silenciar microfone'};
$('leave').onclick=async()=>{if(room)await room.disconnect();room=null;$('participants').innerHTML='';$('mute').disabled=true;$('leave').disabled=true;status('Você saiu da sala')};
$('invite').onclick=async()=>{try{const j=await api('invites',{session:user.token,name:$('inviteName').value,role:$('inviteRole').value,room:$('inviteRoom').value});$('inviteResult').textContent='Convite: '+j.code+' (válido por 7 dias)'}catch(e){$('inviteResult').textContent=e.message}};
draw();
</script></body></html>
